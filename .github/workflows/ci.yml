name: KeyLingo validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_PROVIDER_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test -- --ci
      - name: Native component integration
        run: npm run test:native -- --ci
      - name: Validate bundled learning content
        run: npm run content:validate
      - name: Expo compatibility checks
        run: npm run doctor
      - name: Export web preview
        run: npm run export:web
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows and responsive captures
        run: npm run test:e2e
      - name: Upload reviewable web preview
        uses: actions/upload-artifact@v4
        with:
          name: keylingo-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

# Native build/signing and device Maestro runs are separate release gates.
# The exported artifact is explicitly a mock-services preview, not a store build.
